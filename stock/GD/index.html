    <script>
        let allData = [];

        async function init() {
            try {
                // [변경] 경로(Path) 방식: "/stock/TSLA" 에서 "TSLA" 추출
                const pathSegments = window.location.pathname.split('/');
                let ticker = pathSegments[pathSegments.length - 1];

                // 혹시 주소가 "/stock/TSLA/" 처럼 끝에 슬래시가 붙을 경우 대비
                if (!ticker) ticker = pathSegments[pathSegments.length - 2];

                // URL 파라미터가 있다면 (기존 방식 하위 호환)
                const params = new URLSearchParams(window.location.search);
                if (!ticker || ticker === 'page.html') {
                    ticker = params.get('ticker');
                }

                if (ticker) ticker = ticker.toUpperCase();

                if (!ticker || ticker === 'STOCK' || ticker === 'PAGE.HTML') {
                    // 티커가 없는 경우 홈으로 리다이렉트 하지 않고 대기 (또는 에러 표시)
                    // alert('잘못된 접근입니다.');
                    // location.href = 'index.html';
                    // return;
                }

                if (!ticker) {
                    alert('종목을 찾을 수 없습니다.');
                    location.href = '/';
                    return;
                }

                // data.json 경로 주의 (루트 기준)
                // data.json 경로 주의 (data/ 폴더)
                const res = await fetch('/data/data.json?t=' + new Date().getTime());
                allData = await res.json();

                const stockData = allData.find(d => d.ticker === ticker);

                if (!stockData) {
                    document.getElementById('mainContent').innerHTML = '<div class="p-20 text-center text-red-400">해당 종목 데이터를 찾을 수 없습니다.</div>';
                    return;
                }

                // --- SEO 핵심 추가: 동적 타이틀, 메타설명, Canonical Tag ---
                const today = new Date();
                // Date removed from title/desc as requested

                // 1. Title 업데이트 (SEO 최적화: '주가 전망', '목표가' 키워드 포함)
                document.title = `${stockData.ticker} 주가 전망 & 목표가 | ${stockData.name} AI 분석 - 나스픽`;

                // 2. Meta Description 업데이트 (SEO 최적화: '적정 주가', '목표가', '배당', '실적' 키워드 포함)
                const metaDesc = document.querySelector('meta[name="description"]');
                const cal = stockData.calendar || {};
                let metaDividend = cal.dividend_yield ? `배당: ${cal.dividend_yield}%.` : '';
                let metaEarnings = cal.next_earnings ? `다음 실적: ${cal.next_earnings}.` : '';
                if (metaDesc) {
                    metaDesc.setAttribute('content',
                        `${stockData.name}(${stockData.ticker}) 주가 전망 & AI 분석. 현재가 $${stockData.current_price} 분석 완료. 내 평단가 입력하면 5초 만에 상위 몇 %인지 진단해 드립니다. 월가 목표가와 비교해보세요.`.trim()
                    );
                }

                // 3. Canonical Tag 설정
                let canonicalLink = document.querySelector('link[rel="canonical"]');
                if (!canonicalLink) {
                    canonicalLink = document.createElement('link');
                    canonicalLink.rel = 'canonical';
                    document.head.appendChild(canonicalLink);
                }
                canonicalLink.href = `https://naspick.com/stock/${stockData.ticker}`;

                // 4. OG Image 동적 업데이트 (종목 로고)
                // Fallback이 이미 헤더에 있지만, 종목별 이미지가 있다면 교체
                const ogImage = document.querySelector('meta[property="og:image"]');
                if (ogImage) {
                    // FMP 로고 활용 (또는 차트 이미지)
                    ogImage.setAttribute('content', `https://financialmodelingprep.com/image-stock/${stockData.ticker.replace('.', '-')}.png`);
                }
                const twitterImage = document.querySelector('meta[name="twitter:image"]');
                if (twitterImage) {
                    twitterImage.setAttribute('content', `https://financialmodelingprep.com/image-stock/${stockData.ticker.replace('.', '-')}.png`);
                }

                // 5. OG/Twitter Title, Description, URL 동적 업데이트 (SEO 최적화)
                const ogTitle = document.querySelector('meta[property="og:title"]');
                if (ogTitle) ogTitle.setAttribute('content', `${stockData.ticker} 주가 전망 & 목표가 | ${stockData.name} AI 분석 - 나스픽`);

                // [SEO] Add Calendar Keywords (Earnings, Dividend)
                let seoExtra = "";
                // cal is already declared above
                if (cal.next_earnings) seoExtra += ` 다음 실적발표: ${cal.next_earnings}.`;
                if (cal.dividend_yield) seoExtra += ` 배당수익률: ${cal.dividend_yield}%.`;
                else if (cal.last_surprise) seoExtra += ` 직전 실적: ${cal.last_surprise > 0 ? '어닝서프라이즈' : '미스'}(${cal.last_surprise}%).`;

                const ogDesc = document.querySelector('meta[property="og:description"]');
                if (ogDesc) ogDesc.setAttribute('content', `${stockData.name}(${stockData.ticker}) 주가 전망 & AI 분석. 현재가 $${stockData.current_price} 분석 완료. 내 평단가 입력하면 5초 만에 상위 몇 %인지 진단해 드립니다. 월가 목표가와 비교해보세요.`);

                const ogUrl = document.querySelector('meta[property="og:url"]');
                if (ogUrl) ogUrl.setAttribute('content', `https://naspick.com/stock/${stockData.ticker}`);

                const twitterTitle = document.querySelector('meta[name="twitter:title"]');
                if (twitterTitle) twitterTitle.setAttribute('content', `${stockData.ticker} 주가 전망 & 목표가 | ${stockData.name} AI 분석 - 나스픽`);

                const twitterDesc = document.querySelector('meta[name="twitter:description"]');
                if (twitterDesc) twitterDesc.setAttribute('content', `${stockData.name}(${stockData.ticker}) 주가 전망 & AI 분석. 현재가 $${stockData.current_price} 분석 완료. 내 평단가 입력하면 5초 만에 상위 몇 %인지 진단해 드립니다. 월가 목표가와 비교해보세요.`);

                // 6. Schema.org 구조화 데이터 (Corporation)
                const schemaScript = document.createElement('script');
                schemaScript.type = 'application/ld+json';
                schemaScript.textContent = JSON.stringify({
                    "@context": "https://schema.org",
                    "@type": "Corporation",
                    "name": stockData.name,
                    "tickerSymbol": stockData.ticker,
                    "description": `${stockData.name} - ${stockData.sector}`,
                    "url": `https://naspick.com/stock/${stockData.ticker}`
                });
                document.head.appendChild(schemaScript);

                // 7. Breadcrumb 스키마 (검색 결과에 경로 표시)
                const breadcrumbScript = document.createElement('script');
                breadcrumbScript.type = 'application/ld+json';
                breadcrumbScript.textContent = JSON.stringify({
                    "@context": "https://schema.org",
                    "@type": "BreadcrumbList",
                    "itemListElement": [{
                        "@type": "ListItem",
                        "position": 1,
                        "name": "홈",
                        "item": "https://naspick.com/"
                    }, {
                        "@type": "ListItem",
                        "position": 2,
                        "name": `${stockData.name} (${stockData.ticker})`,
                        "item": `https://naspick.com/stock/${stockData.ticker}`
                    }]
                });
                document.head.appendChild(breadcrumbScript);

                // 8. hreflang 동적 추가
                const hreflangKo = document.createElement('link');
                hreflangKo.rel = 'alternate';
                hreflangKo.hreflang = 'ko';
                hreflangKo.href = `https://naspick.com/stock/${stockData.ticker}`;
                document.head.appendChild(hreflangKo);

                const hreflangDefault = document.createElement('link');
                hreflangDefault.rel = 'alternate';
                hreflangDefault.hreflang = 'x-default';
                hreflangDefault.href = `https://naspick.com/stock/${stockData.ticker}`;
                document.head.appendChild(hreflangDefault);
                // ----------------------------------------------------

                renderPage(stockData);
                initHeaderSearch();
                initFavorites(stockData.ticker); // [NEW] Initialize favorites

                // Update language switcher to maintain current page
                const langSwitcher = document.getElementById('langSwitcher');
                if (langSwitcher) {
                    langSwitcher.href = `/en/stock/${stockData.ticker}`;
                }

            } catch (err) {
                console.error(err);
                document.getElementById('mainContent').innerHTML = '<div class="p-20 text-center text-red-400">데이터 로드 실패</div>';
            }
        }

        // --- Safe Rendering Helper ---
        function safeRender(fn, data, name = "Section") {
            try {
                return fn(data);
            } catch (e) {
                console.error(`Error rendering ${name}:`, e);
                return `
                    <div class="p-4 bg-red-900/20 border border-red-500/50 rounded-lg text-center my-4">
                        <div class="text-red-400 font-bold text-sm mb-1">⚠️ ${name} 로드 실패</div>
                        <div class="text-gray-500 text-xs">${e.message}</div>
                    </div>
                `;
            }
        }

        // --- Component Functions ---

        function renderTopSection(data) {
            const SECTOR_SLUGS = {
                "기술": "technology", "커뮤니케이션": "communication", "임의소비재": "consumer-discretionary",
                "필수소비재": "consumer-staples", "에너지": "energy", "금융": "financials", "헬스케어": "healthcare",
                "산업재": "industrials", "소재": "materials", "부동산": "real-estate", "유틸리티": "utilities"
            };

            const formatMarketCap = (num) => {
                if (!num) return '-';
                if (num >= 1e12) return (num / 1e12).toFixed(2) + 'T';
                if (num >= 1e9) return (num / 1e9).toFixed(1) + 'B';
                if (num >= 1e6) return (num / 1e6).toFixed(0) + 'M';
                return num.toLocaleString();
            };

            const isPlus = data.change_pct >= 0;
            const changeColor = isPlus ? 'text-red-400' : 'text-blue-400';
            const changeSign = isPlus ? '▲' : '▼';

            let tierClass = 'text-gray-400 border-gray-600 bg-gray-700/20';
            if (data.tier === 1) tierClass = 'text-[#0093ff] border-[#0093ff] bg-[#0093ff]/10';
            else if (data.tier === 2) tierClass = 'text-[#00bba3] border-[#00bba3] bg-[#00bba3]/10';
            else if (data.tier === 3) tierClass = 'text-[#ffb900] border-[#ffb900] bg-[#ffb900]/10';
            else if (data.tier === 4) tierClass = 'text-[#9aa4af] border-[#9aa4af] bg-[#9aa4af]/10';
            else if (data.tier === 5) tierClass = 'text-[#a07557] border-[#a07557] bg-[#a07557]/10';

        function renderFinancialHealth(data) {
            const fh = data.financial_health;
            if (!fh) return '<div class="text-center text-gray-500 text-sm py-4">재무 데이터가 없습니다.</div>';

            const thresholds = {
                per: { good: 15, warn: 25, goodLabel: '저평가', badLabel: '고평가', higherBetter: false, tip: 'PER(주가수익비율): 주가÷주당순이익. 10배 미만이면 저평가, 25배 이상이면 고평가로 판단.' },
                pbr: { good: 1.5, warn: 3, goodLabel: '자산가치↑', badLabel: '고평가', higherBetter: false, tip: 'PBR(주가순자산비율): 주가÷주당순자산. 1배 미만이면 자산가치 대비 저평가.' },
                revenue_growth: { good: 15, warn: 0, goodLabel: '고성장', badLabel: '역성장', higherBetter: true, tip: '매출성장률: 전년대비 매출 증가율. 15% 이상이면 고성장 기업.' },

                roe: { good: 15, warn: 8, goodLabel: '고수익', badLabel: '저효율', higherBetter: true, tip: 'ROE(자기자본이익률): 순이익÷자기자본. 15% 이상이면 자본을 효율적으로 운용.' },
                operating_margin: { good: 15, warn: 5, goodLabel: '마진우수', badLabel: '저마진', higherBetter: true, tip: '영업이익률: 영업이익÷매출. 15% 이상이면 수익성 우수.' },
                debt_ratio: { good: 100, warn: 200, goodLabel: '안정', badLabel: '위험', higherBetter: false, tip: '부채비율: 부채÷자기자본. 100% 미만이면 재무구조 안정.' },
                current_ratio: { good: 1.5, warn: 1, goodLabel: '유동성↑', badLabel: '주의', higherBetter: true, tip: '유동비율: 유동자산÷유동부채. 1.5배 이상이면 단기 지급능력 양호.' }
            };

            const evaluate = (val, t) => {
                if (val === null || val === undefined) return { color: 'text-gray-500', badge: null };
                const good = t.higherBetter ? val >= t.good : val <= t.good;
                const warn = t.higherBetter ? val >= t.warn : val <= t.warn;
                if (good) return { color: 'text-green-400', badge: t.goodLabel, badgeColor: 'bg-green-500/20 text-green-400' };
                if (warn) return { color: 'text-gray-300', badge: null };
                return { color: 'text-red-400', badge: t.badLabel, badgeColor: 'bg-red-500/20 text-red-400' };
            };

            const format = (key, val, suffix = '') => {
                if (val === null || val === undefined) return '<span class="text-gray-500">-</span>';
                const status = evaluate(val, thresholds[key]);
                const badge = status.badge ? `<span class="ml-1 text-[9px] px-1.5 py-0.5 rounded ${status.badgeColor}">${status.badge}</span>` : '';
                return `<span class="${status.color} font-bold">${val}${suffix}</span>${badge}`;

                 <div class="bg-[#1e1e24] rounded-lg p-4 border border-gray-700 mb-3">

                     </div>
                 </div>
                 <div class="bg-[#1e1e24] rounded-lg p-4 border border-gray-700">
                     <div class="grid grid-cols-2 gap-4">

                         <div><div class="text-xs text-gray-400 flex items-center">부채비율${tooltip('debt_ratio')}</div><div class="text-lg">${format('debt_ratio', fh.debt_ratio, '%')}</div></div>

        // [RESTORED] Full Technical Analysis Logic
        function renderTechnical(data) {

            let html = `<h3 class="flex items-center gap-2 text-sm font-bold text-gray-200 mb-4 border-b border-gray-700 pb-2">

                            </div>

                    </div>
                `;
            } else {
                html += `
                    <div class="bg-[#1e1e24] rounded-lg p-3 border border-gray-700">
                        <div class="text-[10px] text-gray-500 uppercase tracking-wider mb-1">캔들 패턴</div>

            // 2. RSI (Restored Full Gauge)
            const rsi = ta.rsi || { value: 50, status: 'neutral' };
            const rsiColor = rsi.status === 'overbought' ? 'text-red-400' : rsi.status === 'oversold' ? 'text-blue-400' : 'text-gray-400';
            const rsiLabel = rsi.status === 'overbought' ? '과매수' : rsi.status === 'oversold' ? '과매도' : '중립';

            html += `
                <div class="bg-[#1e1e24] rounded-lg p-3 border border-gray-700">

                        <div class="text-[10px] text-gray-500 uppercase tracking-wider">RSI (14)</div>

                    </div>
                    <div class="text-center mt-2"><span class="text-2xl font-bold ${rsiColor}">${rsi.value}</span></div>
                </div>
             `;

            // 3. Volume
            const vol = ta.volume || { pct_change: 0 };
            const volColor = vol.pct_change >= 0 ? 'text-red-400' : 'text-blue-400';
            const volSign = vol.pct_change >= 0 ? '+' : '';

                <div class="bg-[#1e1e24] rounded-lg p-3 border border-gray-700">

                    <div class="flex items-center gap-2">
                        <div class="${volColor} text-sm font-bold">평균 대비 ${volSign}${vol.pct_change}%</div>
                    </div>
                </div>
             `;

            html += '</div>';
            return html;
        }

        // [RESTORED] Full Calendar Logic
        function renderCalendar(data) {
            const cal = data.calendar || {};

            // Earnings Logic
            let earningsHtml = '';
            let nextHtml = '';
            if (cal.next_earnings) {
                const todayMs = new Date().setHours(0, 0, 0, 0);
                const nextDate = new Date(cal.next_earnings);
                const diffDays = Math.ceil((nextDate.setHours(0, 0, 0, 0) - todayMs) / (1000 * 60 * 60 * 24));

                let dDay = '';
                let alertIcon = '';
                if (diffDays >= 0) {
                    if (diffDays <= 7) { dDay = `<span class="text-orange-400 font-bold ml-2">D-${diffDays}</span>`; alertIcon = '🔔'; }
                    else if (diffDays <= 14) { dDay = `<span class="text-gray-400 ml-2">D-${diffDays}</span>`; }

                    nextHtml = `<div class="text-xs text-gray-400 mb-1 flex items-center">다음 실적 발표 ${dDay}</div>
                                 <div class="text-sm font-bold text-gray-200 flex items-center gap-2">${cal.next_earnings} ${alertIcon}</div>`;
                } else {
                    nextHtml = `<div class="text-xs text-gray-400 mb-1 flex items-center">직전 실적 발표 <span class="text-gray-600 ml-2 text-[10px]">(종료)</span></div>
                                 <div class="text-sm font-bold text-gray-500 flex items-center gap-2">${cal.next_earnings}</div>`;
                }
            } else {
                nextHtml = `<div class="text-xs text-gray-400 mb-1">실적 발표</div><div class="text-sm text-gray-500">일정 미정</div>`;
            }

            // Past Earnings Surprise
            let pastHtml = '';
            if (cal.last_earnings_date && cal.last_surprise !== undefined) {
                const isBeat = cal.last_surprise > 0;
                const color = isBeat ? 'text-green-400' : 'text-red-400';
                const label = isBeat ? '어닝 서프라이즈' : '어닝 쇼크';
                pastHtml = `
                    <div class="mt-3 pt-3 border-t border-gray-700/50">
                        <div class="text-xs text-gray-400 mb-1 flex justify-between">
                            <span>직전 실적 (${cal.last_earnings_date})</span>

                            <div class="${color} font-bold text-sm">${isBeat ? '+' : ''}${Number(cal.last_surprise).toFixed(2)}%</div>
                        </div>
                    </div>
                 `;
            }
            earningsHtml = nextHtml + pastHtml;

            // Dividend Logic
            let divHtml = '';
            const exDate = cal.ex_dividend_date;
            const amount = cal.dividend_amount ? `$${cal.dividend_amount.toFixed(2)}` : '-';

            if (!exDate || exDate === '-') {
                divHtml = '<div><div class="text-xs text-gray-400 mb-2">배당</div><div class="text-xs text-gray-500 text-center py-2">배당 정보 없음</div></div>';
            } else {
                const todayMs = new Date().setHours(0, 0, 0, 0);
                const exMs = new Date(exDate).setHours(0, 0, 0, 0);
                const isFuture = exMs >= todayMs;

                let statusBadge = isFuture ? '<span class="text-blue-400 text-[10px] ml-1 bg-blue-500/10 px-1 rounded border border-blue-500/30">예정</span>'
                    : '<span class="text-gray-500 text-[10px] ml-1 bg-gray-700/50 px-1 rounded">지급완료</span>'; // Simplified for safety
                let dateColor = isFuture ? 'text-gray-200' : 'text-gray-500';

                divHtml = `
                    <div>
                        <div class="text-xs text-gray-400 mb-2">배당</div>
                        <div class="space-y-4">
                            <div class="flex justify-between items-start">
                                <div>

                                </div>
                            </div>
                            <div class="flex justify-between items-center text-[10px] text-gray-500 bg-gray-800/50 p-2 rounded">
                                <div>지급일: ${cal.dividend_payment_date || '-'}</div>

                            </div>

                 `;
            }

            return `

        function analyzeAvgPrice() {
            const avgInput = document.getElementById('avgPriceInput');
            const qtyInput = document.getElementById('quantityInput');
            const resultDiv = document.getElementById('analysisResult');

            if (!avgInput || !qtyInput || !resultDiv) return;

            const avgPrice = parseFloat(avgInput.value);
            const quantity = parseFloat(qtyInput.value);

            if (!avgPrice || avgPrice <= 0) {
                alert('유효한 매수가를 입력해주세요.');
                return;
            }

            // Try global var first, then DOM fallback
            let cp = window.currentStockPrice;
            if (!cp) {
                const priceEl = document.querySelector('.text-4xl'); // Desktop price
                if (priceEl) {
                    const txt = priceEl.textContent.replace('$', '').replace(',', '');
                    cp = parseFloat(txt);
                }
            }

            if (!cp) {
                resultDiv.innerHTML = '<div class="text-red-400 text-center">현재가 정보를 불러올 수 없습니다.</div>';
                resultDiv.classList.remove('hidden');
                return;
            }

            const pnlPercent = ((cp - avgPrice) / avgPrice * 100).toFixed(2);
            const pnlAmount = quantity ? ((cp - avgPrice) * quantity).toFixed(2) : null;
            const isProfit = pnlPercent >= 0;
            const color = isProfit ? 'text-green-400' : 'text-red-400';
            const sign = isProfit ? '+' : '';

            resultDiv.innerHTML = `
        <div class="text-center">
             <div class="text-gray-400 text-xs mb-1">현재가 $${cp} / 평단가 $${avgPrice}</div>
             <div class="text-3xl font-bold ${color} mb-1">${sign}${pnlPercent}%</div>
             ${pnlAmount ? `<div class="text-lg ${color} font-bold">${sign}$${pnlAmount}</div>` : ''}
        </div>
    `;
            resultDiv.classList.remove('hidden');
        }

        // --- AdController (Google IMA SDK) ---
        class AdController {
            constructor() {
                this.adContainer = null;
                this.videoContent = null;
                this.adDisplayContainer = null;
                this.adsLoader = null;
                this.adsManager = null;
                this.onReward = null;
                this.isInitialized = false;
            }

            init() {
                if (this.isInitialized) return;

                this.adContainer = document.getElementById('adContainer');
                this.videoContent = document.getElementById('contentElement');

                if (!window.google || !window.google.ima) {
                    console.error("Google IMA SDK not loaded");
                    return;
                }

                this.adDisplayContainer = new google.ima.AdDisplayContainer(this.adContainer, this.videoContent);
                this.adsLoader = new google.ima.AdsLoader(this.adDisplayContainer);

                this.adsLoader.addEventListener(
                    google.ima.AdsManagerLoadedEvent.Type.ADS_MANAGER_LOADED,
                    this.onAdsManagerLoaded.bind(this),
                    false);
                this.adsLoader.addEventListener(
                    google.ima.AdErrorEvent.Type.AD_ERROR,
                    this.onAdError.bind(this),
                    false);

                this.isInitialized = true;
            }

            requestAd(callback) {
                console.log("[AdController] requestAd called");
                this.init(); // Ensure init
                this.onReward = callback;

                // Mobile requires user action to initialize container
                this.adContainer.style.display = 'block';

                // Initialize the container. Must be done via a user action on mobile devices.
                this.adDisplayContainer.initialize();

                const adsRequest = new google.ima.AdsRequest();

                // Dynamic Macro Replacement
                const referrer = encodeURIComponent(window.location.href);
                const descUrl = encodeURIComponent(window.location.href);
                const timestamp = new Date().getTime();

                // [Production] Real VAST Tag
                const tagUrl = `https://pubads.g.doubleclick.net/gampad/ads?sz=640x480|1x1&iu=/23339215064/naspick_analysis_reward&ciu_szs='fluid'&env=vp&impl=s&gdfp_req=1&output=vast&unviewed_position_start=1&url=${referrer}&description_url=${descUrl}&correlator=${timestamp}`;

                // [DEBUG] Google Sample Tag (Commented out)
                // const tagUrl = 'https://pubads.g.doubleclick.net/gampad/ads?iu=/21775744923/external/single_ad_samples&sz=640x480&cust_params=sample_ct%3Dlinear&ciu_szs=300x250%2C728x90&gdfp_req=1&output=vast&unviewed_position_start=1&env=vp&impl=s&correlator=';

                console.log("[AdController] Requesting ads with tag:", tagUrl);

                adsRequest.adTagUrl = tagUrl;
                adsRequest.linearAdSlotWidth = this.adContainer.clientWidth;
                adsRequest.linearAdSlotHeight = this.adContainer.clientHeight;
                adsRequest.nonLinearAdSlotWidth = this.adContainer.clientWidth;
                adsRequest.nonLinearAdSlotHeight = this.adContainer.clientHeight / 3;

                this.adsLoader.requestAds(adsRequest);
            }

            onAdsManagerLoaded(adsManagerLoadedEvent) {
                console.log("[AdController] Ads Manager Loaded");
                const adsRenderingSettings = new google.ima.AdsRenderingSettings();
                adsRenderingSettings.restoreCustomPlaybackStateOnAdBreakComplete = true;

                this.adsManager = adsManagerLoadedEvent.getAdsManager(this.videoContent, adsRenderingSettings);
                this.adsManager.addEventListener(google.ima.AdErrorEvent.Type.AD_ERROR, this.onAdError.bind(this));
                this.adsManager.addEventListener(google.ima.AdEvent.Type.ALL_ADS_COMPLETED, this.onAllAdsCompleted.bind(this));
                this.adsManager.addEventListener(google.ima.AdEvent.Type.COMPLETE, this.onAdComplete.bind(this));
                this.adsManager.addEventListener(google.ima.AdEvent.Type.SKIPPED, this.onAdSkipped.bind(this)); // Handle skips if allowed
                this.adsManager.addEventListener(google.ima.AdEvent.Type.LOADED, () => {
                    console.log("[AdController] Ad Loaded");
                });
                this.adsManager.addEventListener(google.ima.AdEvent.Type.STARTED, () => {
                    console.log("[AdController] Ad Started");
                });

                try {
                    this.adsManager.init(this.adContainer.clientWidth, this.adContainer.clientHeight, google.ima.ViewMode.NORMAL);
                    this.adsManager.start();
                } catch (adError) {
                    console.error("[AdController] Init/Start Error:", adError);
                    this.onAdError(adError);
                }
            }

            onAdError(adErrorEvent) {
                const error = adErrorEvent.getError ? adErrorEvent.getError() : adErrorEvent;
                console.log("Ad Error: " + error);

                // Show polite toast to user
                showToast("광고를 불러올 수 없어 분석을 바로 시작합니다.");

                this.closeAd();
                if (this.onReward) this.onReward(); // Fallback: Unlock on error
            }

            onAdSkipped() {
                this.closeAd();
                // Decide if skip grants reward. Usually NO for rewarded ads, but for better UX in test we might.
                // For now, let's say skip = no reward, but since we don't have a retry UI, let's just grant it or do nothing.
                // Better: Grant reward to avoid user getting stuck.
                if (this.onReward) this.onReward();
            }

            onAdComplete() {
                if (this.onReward) {
                    this.onReward();
                    this.onReward = null; // Consume callback
                }
            }

            onAllAdsCompleted() {
                this.closeAd();
                if (this.onReward) {
                    this.onReward();
                    this.onReward = null;
                }
            }

            closeAd() {
                this.adContainer.style.display = 'none';
                if (this.adsManager) {
                    this.adsManager.destroy(); // Important to destroy
                    this.adsManager = null;
                }
            }
        }

            // [Ad Gate]

            if (!force) {
                showAdConfirmationModal(() => {

            }

            // 1. Loading Animation (Overlay)
            resultDiv.classList.remove('hidden');
            resultDiv.innerHTML = `
                <div class="flex-1 flex flex-col items-center justify-center h-full">

            const delay = (ms) => new Promise(r => setTimeout(r, ms));
            const updateMsg = async (msg, ms) => {
                const el = document.getElementById('loadingText');
                if (el) el.textContent = msg;
                await delay(ms);
            };

            await updateMsg("📊 거래 데이터 스캔 중...", 800);
            await updateMsg("🔍 매물대 분포 계산 중...", 800);
            await updateMsg("✅ 분석 완료!", 500);

            // 2. Get Data
            let ticker = null;
            const pathSegments = window.location.pathname.split('/');
            ticker = pathSegments[pathSegments.length - 1];
            if (!ticker) ticker = pathSegments[pathSegments.length - 2];
            if (!ticker && window.location.search) ticker = new URLSearchParams(window.location.search).get('ticker');
            if (ticker) ticker = ticker.toUpperCase();

            const stockData = (window.allData || []).find(d => d.ticker === ticker);

                        <button onclick="resetAnalysis()" class="text-sm text-gray-400 underline">돌아가기</button>
                    </div>`;
                return;
            }

            // 3. Calculation
            const pnlPercent = ((currentPrice - avgPrice) / avgPrice * 100);
            const targetPrice = stockData?.consensus?.target_price?.mean || (currentPrice * 1.15);

            // Volume Profile Logic
            let myRank = 50;
            let peakPrice = currentPrice;
            let totalVolume = 0;
            const vp = stockData?.volume_profile;
            const buckets = vp?.buckets;
            if (buckets) {
                let volumeAboveMe = 0;
                totalVolume = 0; // Reset to strict bucket sum
                let maxVol = 0;
                Object.entries(buckets).forEach(([pStr, vol]) => {
                    const price = Number(pStr);
                    totalVolume += vol;
                    if (price > avgPrice) volumeAboveMe += vol;
                    if (vol > maxVol) { maxVol = vol; peakPrice = price; }
                });
                // Removed: if (vp.total_volume) totalVolume = vp.total_volume;  <-- Corrects the ratio issue

                if (totalVolume > 0) {
                    // Logic: Higher volume above me = Worse entry = High Rank Number?
                    // No. volumeAboveMe/totalVolume = % worse than me.
                    // If 90% is worse (above), I am Top 10%.
                    // myRank should be 10.
                    // volumeAboveMe includes prices > avgPrice (higher).
                    // If I buy low, most prices are > avgPrice. volumeAboveMe is HIGH.
                    // If volumeAboveMe is 100% of volume.
                    // myRank = 100 - 100 = 0 (Top 1%). Correct.
                    myRank = 100 - (volumeAboveMe / totalVolume * 100);
                }
            } else {
                const diff = (avgPrice - currentPrice) / currentPrice;
                // If diff is negative (My Price < Current Price), I am in profit.
                // Better entry -> Lower Rank number.
                myRank = 50 + (diff * 100);

            if (myRank < 1) myRank = 1.0;

        // --- Shared Hangul Search Helpers ---
        const getChosung = (str) => {
            const chosung = ["ㄱ", "ㄲ", "ㄴ", "ㄷ", "ㄸ", "ㄹ", "ㅁ", "ㅂ", "ㅃ", "ㅅ", "ㅆ", "ㅇ", "ㅈ", "ㅉ", "ㅊ", "ㅋ", "ㅌ", "ㅍ", "ㅎ"];
            let result = "";
            for (let i = 0; i < str.length; i++) {
                const code = str.charCodeAt(i) - 44032;
                if (code > -1 && code < 11172) {
                    result += chosung[Math.floor(code / 588)];
                } else {
                    result += str.charAt(i);
                }
            }
            return result;
        };

        const getJamo = (str) => {
            const chosung = ["ㄱ", "ㄲ", "ㄴ", "ㄷ", "ㄸ", "ㄹ", "ㅁ", "ㅂ", "ㅃ", "ㅅ", "ㅆ", "ㅇ", "ㅈ", "ㅉ", "ㅊ", "ㅋ", "ㅌ", "ㅍ", "ㅎ"];
            const jungsung = ["ㅏ", "ㅐ", "ㅑ", "ㅒ", "ㅓ", "ㅔ", "ㅕ", "ㅖ", "ㅗ", "ㅘ", "ㅙ", "ㅚ", "ㅛ", "ㅜ", "ㅝ", "ㅞ", "ㅟ", "ㅠ", "ㅡ", "ㅢ", "ㅣ"];
            const jongsung = ["", "ㄱ", "ㄲ", "ㄳ", "ㄴ", "ㄵ", "ㄶ", "ㄷ", "ㄹ", "ㄺ", "ㄻ", "ㄼ", "ㄽ", "ㄾ", "ㄿ", "ㅀ", "ㅁ", "ㅂ", "ㅄ", "ㅅ", "ㅆ", "ㅇ", "ㅈ", "ㅊ", "ㅋ", "ㅌ", "ㅍ", "ㅎ"];

            let result = "";
            for (let i = 0; i < str.length; i++) {
                const code = str.charCodeAt(i) - 44032;
                if (code > -1 && code < 11172) {
                    const c = Math.floor(code / 588);
                    const j = Math.floor((code % 588) / 28);
                    const k = code % 28;
                    result += chosung[c] + jungsung[j];
                    if (k > 0) result += jongsung[k];
                } else {
                    result += str.charAt(i);
                }
            }
            return result;
        };

        const decomposeHangul = (str) => {
            const doubleConsonants = {
                'ㄳ': 'ㄱㅅ', 'ㄵ': 'ㄴㅈ', 'ㄶ': 'ㄴㅎ', 'ㄺ': 'ㄹㄱ', 'ㄻ': 'ㄹㅁ',
                'ㄼ': 'ㄹㅂ', 'ㄽ': 'ㄹㅅ', 'ㄾ': 'ㄹㅌ', 'ㄿ': 'ㄹㅍ', 'ㅀ': 'ㄹㅎ', 'ㅄ': 'ㅂㅅ'
            };
            return str.split('').map(char => doubleConsonants[char] || char).join('');
        };

        const normalizeStr = (str) => str ? str.toLowerCase().replace(/\s+/g, '') : '';

        // Helper to check data availability
        function getSearchData() {
            return window.allData || [];
        }

        function handleAnalysisSearch(input) {
            // Force focus to keep keyboard open on mobile
            // input.focus(); 

            const term = input.value.trim().toLowerCase().replace(/\s+/g, '');
            const resultsDiv = document.getElementById('analysisSearchResults');
            const data = getSearchData();

            if (!term) {
                resultsDiv.classList.add('hidden');
                resultsDiv.innerHTML = '';
                return;
            }

            // Determine Combined/Chosung/Jamo Search Mode
            const hasHangulSyllable = /[가-힣]/.test(term);
            let matches = [];

            if (hasHangulSyllable) {
                const jamoTerm = getJamo(term);
                matches = data.filter(d => {
                    const normName = normalizeStr(d.name);
                    return d.ticker.toLowerCase().includes(term) ||
                        normName.includes(term) ||
                        getJamo(normName).includes(jamoTerm) ||
                        (d.name_en && normalizeStr(d.name_en).includes(term));
                }).slice(0, 5);
            } else {
                const normalizedTerm = decomposeHangul(term);
                const chosungTerm = getChosung(normalizedTerm);
                matches = data.filter(d =>
                    d.ticker.toLowerCase().includes(term) ||
                    normalizeStr(d.name).includes(normalizedTerm) ||
                    getChosung(normalizeStr(d.name)).includes(chosungTerm) ||
                    (d.name && d.name.toLowerCase().includes(term)) ||
                    normalizeStr(d.name_en).includes(normalizedTerm) ||
                    (d.name_en && d.name_en.toLowerCase().includes(term))
                ).slice(0, 5);
            }

            if (matches.length === 0) {
                resultsDiv.innerHTML = '<div class="p-3 text-center text-gray-500 text-xs">검색 결과가 없습니다</div>';
            } else {
                resultsDiv.innerHTML = matches.map(d => {
                    const isUp = d.change_pct >= 0;
                    return `
                        <a href="/stock/${d.ticker}" class="flex items-center justify-between p-3 hover:bg-gray-700 transition cursor-pointer border-b border-gray-700 last:border-0 text-decoration-none">
                            <div class="flex items-center gap-2">
                                <div class="font-bold text-white text-sm">${d.ticker}</div>
                                <div class="text-xs text-gray-400 truncate max-w-[100px]">${d.name}</div>
                            </div>
                            <div class="text-xs font-bold ${isUp ? 'text-red-400' : 'text-blue-400'}">${isUp ? '+' : ''}${d.change_pct}%</div>
                        </a>
                    `;
                }).join('');
            }
            resultsDiv.classList.remove('hidden');
        }


        function renderFAQ(data) {
            const today = new Date().toISOString().split('T')[0];
            const qnaList = [];

            // 1. Investment Score
            let scoreAns = "";
            if (data.final_score >= 80) scoreAns = `투자 매력도가 매우 높습니다. 현재 주가 상승 모멘텀과 재무 건전성이 모두 우수한 상태입니다.`;
            else if (data.final_score < 40) scoreAns = `다소 주의가 필요합니다. 현재 주가 모멘텀이나 재무 지표가 다소 약화된 상태입니다.`;
            else scoreAns = `보통 수준의 양호한 흐름을 보이고 있습니다.`;

            qnaList.push({
                q: `${data.name}(${data.ticker})의 현재 투자 등급과 점수는?`,
                a: `${today} 기준 나스픽 AI 분석 결과, ${data.name}은(는) **${data.final_score}점(${data.tier}티어)**으로 ${scoreAns}`
            });

            // 2. Valuation (PER)
            let perAns = "";
            // Fix: Use data.financial_health.per
            const per = data.financial_health?.per;
            if (per) {
                if (per < 15) perAns = `네, 그렇습니다. 현재 ${data.name}의 PER은 **${per.toFixed(2)}배**로, 시장 평균 대비 **저평가**되어 있어 가격 매력도가 높은 구간입니다.`;
                else if (per > 50) perAns = `현재 ${data.name}의 PER은 **${per.toFixed(2)}배**로, 시장 평균 대비 다소 **높게 평가**받고 있습니다. 이는 높은 성장 기대감이 반영된 결과일 수 있습니다.`;
                else perAns = `현재 ${data.name}의 PER은 **${per.toFixed(2)}배**로, 시장 평균과 유사한 **적정 가치** 수준에서 거래되고 있습니다.`;

                qnaList.push({
                    q: `${data.name}(${data.ticker}) 주식은 현재 저평가 상태인가요? (PER 분석)`,
                    a: perAns
                });
            } else {
                qnaList.push({
                    q: `${data.name}(${data.ticker}) 주식은 현재 저평가 상태인가요? (PER 분석)`,
                    a: `현재 ${data.name}에 대한 PER(주가수익비율) 데이터가 집계되지 않았습니다.`
                });
            }

            // 3. Technical (RSI)
            let rsiAns = "";
            // Fix: Use data.technical_analysis.rsi.value
            const rsiObj = data.technical_analysis?.rsi;
            const rsi = rsiObj ? rsiObj.value : null;

            if (rsi) {
                if (rsi > 70) rsiAns = `주의가 필요합니다. 현재 RSI 지표가 **${rsi.toFixed(2)}**로 **과매수(과열)** 구간에 진입해 있어, 단기적으로 주가가 조정받을 가능성이 있습니다.`;
                else if (rsi < 30) rsiAns = `네, 기술적으로 좋은 기회일 수 있습니다. 현재 RSI 지표가 **${rsi.toFixed(2)}**로 **과매도** 구간에 있어, 기술적 반등이 기대되는 시점입니다.`;
                else rsiAns = `현재 기술적 지표는 **중립**입니다. RSI 지표가 **${rsi.toFixed(2)}**로 안정적인 흐름을 보이고 있어, 분할 매수 관점에서 접근하기 좋습니다.`;

                qnaList.push({
                    q: `지금 ${data.name}(${data.ticker}) 주식을 사도 될까요? (RSI 기술적 분석)`,
                    a: rsiAns
                });
            } else {
                qnaList.push({
                    q: `지금 ${data.name}(${data.ticker}) 주식을 사도 될까요? (RSI 기술적 분석)`,
                    a: `현재 기술적 지표(RSI)를 분석할 충분한 데이터가 없습니다.`
                });
            }

            // 4. Calendar (Fixed: Check for past dates)
            const cal = data.calendar || {};
            let calAnsParts = [];

            // A. Dividend Logic
            if (cal.dividend_yield) {
                let divMsg = `예상 배당 수익률은 **${cal.dividend_yield}%**이며, `;
                if (cal.ex_dividend_date && cal.ex_dividend_date !== '-') {
                    const todayMs = new Date().setHours(0, 0, 0, 0);
                    const exDateMs = new Date(cal.ex_dividend_date).setHours(0, 0, 0, 0);

                    if (exDateMs >= todayMs) {
                        divMsg += `다가오는 배당락일은 **${cal.ex_dividend_date}**입니다.`;
                    } else {
                        divMsg += `가장 최근 배당락일은 **${cal.ex_dividend_date}**였습니다.`;
                    }
                } else {
                    divMsg += `배당락일 정보는 아직 없습니다.`;
                }
                calAnsParts.push(divMsg);
            }

            // B. Earnings Logic
            if (cal.next_earnings) {
                const todayMs = new Date().setHours(0, 0, 0, 0);
                const nextDocs = new Date(cal.next_earnings);
                // Check if date is valid
                if (!isNaN(nextDocs.getTime())) {
                    const nextMs = nextDocs.setHours(0, 0, 0, 0);
                    if (nextMs >= todayMs) {
                        calAnsParts.push(`다음 실적 발표는 **${cal.next_earnings}**로 예정되어 있습니다.`);
                    } else {
                        calAnsParts.push(`직전 실적 발표일은 **${cal.next_earnings}**였으며,`);
                        // If we have surprise data for this past date (usually in last_surprise), append it.
                        // However, cal.next_earnings might be the *just passed* one.
                        // We can just look at last_surprise generally.
                        if (cal.last_surprise) {
                            calAnsParts.push(`시장 예상치 대비 **${cal.last_surprise > 0 ? '어닝 서프라이즈' : '미스'}(${cal.last_surprise}%)**를 기록했습니다.`);
                        } else {
                            calAnsParts.push(`발표가 완료되었습니다.`);
                        }
                    }
                } else {
                    calAnsParts.push(`다음 실적 발표는 **${cal.next_earnings}**로 예정되어 있습니다.`);
                }
            } else if (cal.last_surprise) {
                calAnsParts.push(`가장 최근 실적발표(${cal.last_earnings_date})에서는 시장 예상치를 상회하는 **어닝 서프라이즈(${cal.last_surprise > 0 ? '+' : ''}${cal.last_surprise}%)**를 기록했습니다.`);
            }

            if (calAnsParts.length > 0) {
                qnaList.push({
                    q: `${data.name}(${data.ticker})의 다음 실적 발표일과 배당금은?`,
                    a: calAnsParts.join(' ')
                });
            } else {
                qnaList.push({
                    q: `${data.name}(${data.ticker})의 다음 실적 발표일과 배당금은?`,
                    a: `현재 ${data.name}의 확정된 실적 발표일이나 배당 일정 정보가 없습니다.`
                });
            }

            // 5. Price & Target
            const consensus = data.consensus || {};
            // Fix: target_price might be an object {mean: ...} or number
            let tp = consensus.target_price;
            if (tp && typeof tp === 'object') tp = tp.mean;

            if (tp && data.current_price) {
                const upside = ((tp - data.current_price) / data.current_price * 100).toFixed(2);
                const upsidedown = upside > 0 ? '상승 여력' : '수준';
                qnaList.push({
                    q: `${data.name}(${data.ticker})의 현재 주가와 목표주가는 얼마인가요? (주가 전망)`,
                    a: `${today} 기준 ${data.name}의 주가는 **$${data.current_price}**입니다. 월스트리트 전문가들의 평균 목표주가는 **$${tp.toFixed(2)}**로, 현재가 대비 약 **${upside}%의 ${upsidedown}**이 있는 것으로 분석됩니다.`
                });
            } else {
                qnaList.push({
                    q: `${data.name}(${data.ticker})의 현재 주가와 목표주가는 얼마인가요? (주가 전망)`,
                    a: `${data.name}에 대한 월스트리트 전문가들의 목표주가 데이터가 현재 충분하지 않습니다.`
                });
            }

            // 6. Naspick AI Score & Tier (SEO: 'AI 분석', '주식 티어' 키워드)
            let tierDescription = '';
            if (data.tier === 1) tierDescription = '최상위 등급으로, 현재 시장에서 가장 강력한 상승 모멘텀과 우수한 펀더멘털을 보유한 종목입니다.';
            else if (data.tier === 2) tierDescription = '우량 등급으로, 안정적인 성장성과 양호한 투자 매력도를 갖춘 종목입니다.';
            else if (data.tier === 3) tierDescription = '보통 등급으로, 시장 평균 수준의 흐름을 보이고 있습니다.';
            else tierDescription = '주의 등급으로, 현재 모멘텀이나 펀더멘털 개선이 필요한 상태입니다.';

            qnaList.push({
                q: `${data.name}(${data.ticker})의 나스픽 AI 점수와 티어 등급은 어떻게 되나요?`,
                a: `${today} 기준 ${data.name}의 나스픽 AI 종합 점수는 **${data.final_score}점**이며, **${data.tier}티어** 등급입니다. ${tierDescription} 이 점수는 기술적 분석, 펀더멘털, 시장 센티먼트를 종합하여 15분마다 실시간 업데이트됩니다.`
            });

            // Render HTML (Accordion Style)
            const faqContainer = document.getElementById('faqSection');
            if (faqContainer) {
                faqContainer.innerHTML = `
                    <div class="mt-8 bg-[#23232a] rounded-xl border border-gray-800 p-6">
                        <h3 class="text-lg font-bold text-gray-200 mb-4 flex items-center gap-2">
                             💬 자주 묻는 질문 (FAQ)
                        </h3>
                        <div class="space-y-3">
                            ${qnaList.map(item => `
                                <details class="group bg-[#1c1c1f] rounded-lg border border-gray-800/50 open:border-gray-700 transition-all">
                                    <summary class="flex justify-between items-center p-4 cursor-pointer list-none">
                                        <h4 class="font-bold text-gray-300 text-sm">Q. ${item.q}</h4>
                                        <svg class="w-4 h-4 text-gray-500 transition-transform group-open:rotate-180" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                                    </summary>
                                    <p class="px-4 pb-4 text-sm text-gray-400 leading-relaxed border-t border-gray-800/50 pt-3">
                                        ${item.a.replace(/\*\*(.*?)\*\*/g, '<span class="text-gray-200 font-bold">$1</span>')}
                                    </p>
                                </details>
                            `).join('')}
                        </div>
                    </div>
                `;
            }

            // Inject JSON-LD Schema
            const schemaData = {
                "@context": "https://schema.org",
                "@type": "FAQPage",
                "mainEntity": qnaList.map(item => ({
                    "@type": "Question",
                    "name": item.q,
                    "acceptedAnswer": {
                        "@type": "Answer",
                        "text": item.a.replace(/\*\*/g, '') // Remove markdown bold for schema
                    }
                }))
            };

            const script = document.createElement('script');
            script.type = 'application/ld+json';
            script.text = JSON.stringify(schemaData);
            document.head.appendChild(script);
        }

        // [NEW] Favorites Logic for Page
        function initFavorites(ticker) {
            const favorites = new Set(JSON.parse(localStorage.getItem('naspick_favorites') || '[]'));
            const container = document.getElementById('favoriteContainer');
            if (!container) return;

            // Render Button
            const isFav = favorites.has(ticker);
            renderFavoriteButton(container, isFav);

            // Click Handler
            container.onclick = (e) => {
                e.stopPropagation();
                if (favorites.has(ticker)) {
                    favorites.delete(ticker);
                } else {
                    favorites.add(ticker);
                }
                localStorage.setItem('naspick_favorites', JSON.stringify([...favorites]));

                // Update UI immediately
                renderFavoriteButton(container, favorites.has(ticker));
            };
        }

        function renderFavoriteButton(container, isFav) {
            container.innerHTML = `
                <button class="transition hover:scale-110 p-1 group">
                    <svg class="w-6 h-6 md:w-8 md:h-8 ${isFav ? 'text-yellow-400 fill-current' : 'text-gray-500 fill-transparent group-hover:text-yellow-400'}" 
                         xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M11.48 3.499a.562.562 0 011.04 0l2.125 5.111a.563.563 0 00.475.345l5.518.442c.499.04.701.663.321.988l-4.204 3.602a.563.563 0 00-.182.557l1.285 5.385a.562.562 0 01-.84.61l-4.725-2.885a.563.563 0 00-.586 0L6.982 20.54a.562.562 0 01-.84-.61l1.285-5.386a.562.562 0 00-.182-.557l-4.204-3.602a.563.563 0 01.321-.988l5.518-.442a.563.563 0 00.475-.345L11.48 3.5z" />
                    </svg>
                </button>
            `;
        }

        function initHeaderSearch() {
            const input = document.getElementById('headerSearch');
            const resultsDiv = document.getElementById('headerSearchResults');

            // Expose allData globally for Analysis Search
            if (typeof allData !== 'undefined') {
                window.allData = allData;
            }

            input.addEventListener('input', (e) => {
                const term = e.target.value.toLowerCase().replace(/\s+/g, ''); // Remove spaces
                if (!term) {
                    resultsDiv.classList.add('hidden');
                    return;
                }

                // Determine Search Mode
                const hasHangulSyllable = /[가-힣]/.test(term);
                let matches = [];

                if (hasHangulSyllable) {
                    // [Mode A] Hybrid Jamo Search
                    const jamoTerm = getJamo(term);

                    matches = allData.filter(d => {
                        const normName = normalizeStr(d.name);
                        return d.ticker.toLowerCase().includes(term) ||
                            normName.includes(term) ||
                            getJamo(normName).includes(jamoTerm) ||
                            (d.name_en && normalizeStr(d.name_en).includes(term));
                    }).slice(0, 5);

                } else {
                    // [Mode B] Standard/Chosung Search
                    const normalizedTerm = decomposeHangul(term);
                    const chosungTerm = getChosung(normalizedTerm);

                    matches = allData.filter(d =>
                        d.ticker.toLowerCase().includes(term) ||
                        normalizeStr(d.name).includes(normalizedTerm) ||
                        getChosung(normalizeStr(d.name)).includes(chosungTerm) ||
                        (d.name && d.name.toLowerCase().includes(term)) ||
                        normalizeStr(d.name_en).includes(normalizedTerm) ||
                        (d.name_en && d.name_en.toLowerCase().includes(term))
                    ).slice(0, 5);
                }

                if (matches.length > 0) {
                    // SEO 수정: div onclick -> a href
                    resultsDiv.innerHTML = matches.map(d => {
                        let tierClass = 'text-gray-400 border-gray-600 bg-gray-700/20';
                        if (d.tier === 1) tierClass = 'text-[#0093ff] border-[#0093ff] bg-[#0093ff]/10';
                        else if (d.tier === 2) tierClass = 'text-[#00bba3] border-[#00bba3] bg-[#00bba3]/10';
                        else if (d.tier === 3) tierClass = 'text-[#ffb900] border-[#ffb900] bg-[#ffb900]/10';
                        else if (d.tier === 4) tierClass = 'text-[#9aa4af] border-[#9aa4af] bg-[#9aa4af]/10';
                        else if (d.tier === 5) tierClass = 'text-[#a07557] border-[#a07557] bg-[#a07557]/10';

                        const tierBadge = `<span class="px-1.5 py-0.5 text-[9px] font-bold rounded border ${tierClass}">${d.tier} Tier</span>`;

                        return `
                        <a href="/stock/${d.ticker}" class="p-2 hover:bg-[#3e63b0] cursor-pointer border-b border-gray-700 last:border-0 flex justify-between items-center block text-inherit hover:no-underline">
                            <div>
                                <span class="font-bold text-xs text-white">${d.ticker}</span>
                                <span class="text-[10px] text-gray-400 ml-1">${d.name}</span>
                            </div>
                            <div class="text-right">
                                <span class="text-[#5383e8] text-[10px] font-bold block">${d.final_score}</span>
                                <div class="mt-0.5">${tierBadge}</div>
                            </div>
                        </a>
                        `;
                    }).join('');
                    resultsDiv.classList.remove('hidden');
                } else {
                    resultsDiv.innerHTML = '<div class="p-2 text-gray-500 text-[10px]">검색 결과 없음</div>';
                    resultsDiv.classList.remove('hidden');
                }
            });

            document.addEventListener('click', (e) => {
                if (!input.contains(e.target) && !resultsDiv.contains(e.target)) {
                    resultsDiv.classList.add('hidden');
                }
            });
        }

        // --- Custom UI Helpers ---
        function showAdConfirmationModal(onConfirm) {
            const modal = document.getElementById('adConfirmModal');
            const confirmBtn = document.getElementById('btnAdConfirm');
            const cancelBtn = document.getElementById('btnAdCancel');

            if (!modal) return;

            modal.classList.remove('hidden');
            modal.style.display = 'flex'; // Ensure flex for centering

            const close = () => {
                modal.classList.add('hidden');
                modal.style.display = 'none';
            };

            confirmBtn.onclick = () => {
                close();
                onConfirm();
            };

            cancelBtn.onclick = () => {
                close();
            };
        }

        function showToast(msg) {
            const container = document.getElementById('toastContainer');
            if (!container) return;

            const el = document.createElement('div');
            el.className = 'bg-[#333] text-white px-4 py-3 rounded-lg shadow-lg mb-3 flex items-center gap-2 text-sm border-l-4 border-[#2962ff] toast-enter';
            el.innerHTML = `
                <svg class="w-4 h-4 text-[#2962ff]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                <span>${msg}</span>
            `;

            container.appendChild(el);

            // Animation
            requestAnimationFrame(() => {
                el.classList.add('toast-enter-active');
                el.classList.remove('toast-enter');
            });

            setTimeout(() => {
                el.style.opacity = '0';
                el.style.transform = 'translateY(10px)';
                setTimeout(() => el.remove(), 300);
            }, 3000);
        }

        init();
    </script>

    <footer class="text-center text-[10px] md:text-xs text-gray-500 py-3 md:py-4 px-4 border-t border-gray-800 mt-6">
        <p>본 사이트의 정보는 투자 참고용이며, 투자 결정과 손익에 대한 책임은 투자자 본인에게 있습니다.</p>
        <p class="mt-1">© 2026 나스픽(NASPICK)</p>
    </footer>

    <!-- [NEW] Ad Container -->
    <div id="adContainer">
        <video id="contentElement"></video>
    </div>

    <!-- [NEW] Custom Ad Modal -->
    <div id="adConfirmModal"
        class="fixed inset-0 z-[9990] bg-black/60 hidden items-center justify-center p-4 backdrop-blur-sm"
        style="display: none;">
        <div class="glass-modal w-full max-w-sm rounded-2xl p-6 relative overflow-hidden animate-fade-in-up">
            <!-- Decor -->
            <div class="absolute -top-10 -right-10 w-32 h-32 bg-blue-500/20 rounded-full blur-3xl"></div>
            <div class="absolute -bottom-10 -left-10 w-32 h-32 bg-purple-500/20 rounded-full blur-3xl"></div>

            <div class="relative z-10 text-center">
                <!-- Modal Content -->
                <div
                    class="bg-[#282830] rounded-2xl p-6 w-full max-w-sm text-center border border-gray-700 shadow-2xl transform transition-all scale-100 relative overflow-hidden">
                    <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-blue-500 to-purple-500"></div>

                    <h3 class="text-xl font-bold text-white mb-2">무료 분석 결과 잠금 해제</h3>
                    <p class="text-gray-400 text-sm mb-6 leading-relaxed">
                        AI가 데이터를 분석하는 동안<br>짧은 광고를 시청하고 결과를 확인하세요.
                    </p>

                    <div class="space-y-3">
                        <button id="btnAdConfirm"
                            class="w-full bg-gradient-to-r from-[#2962ff] to-[#0039cb] hover:from-[#448aff] hover:to-[#2962ff] text-white font-bold py-3.5 rounded-xl shadow-lg hover:shadow-blue-500/30 transition-all flex items-center justify-center gap-2 group">
                            <svg class="w-5 h-5 group-hover:scale-110 transition" fill="none" stroke="currentColor"
                                viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z">
                                </path>
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                            </svg>
                            <span>🚀 분석하는 동안 광고 시청</span>
                        </button>
                        <button id="btnAdCancel"
                            class="text-xs text-gray-500 hover:text-gray-300 transition underline decoration-gray-700">
                            괜찮습니다, 나중에 할게요
                        </button>
                    </div>
                </div>
            </div>

        </div>
    </div>
    </div>
    </div>

    <!-- Toast Container -->
    <div id="toastContainer"
        class="fixed bottom-5 left-1/2 transform -translate-x-1/2 z-[10001] flex flex-col items-center w-full max-w-xs pointer-events-none">
    </div>
</body>
